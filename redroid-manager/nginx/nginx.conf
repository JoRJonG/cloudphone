map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 100M;

    # ============================================================
    # /api/stream/* → ws-scrcpy โดยตรง (WS + HTTP)
    # ลด latency สูงสุด: frame ไม่ผ่าน Python เลย
    # ============================================================
    location /api/stream/ {
        proxy_pass http://ws-scrcpy:8000/;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;

        # ป้องกัน timeout กลางอากาศ (stream ยาวนาน)
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # ปิด buffer: forward ทุก byte ทันที
        proxy_buffering off;

        # ปิด gzip จาก upstream เพื่อให้ sub_filter ทำงานได้
        proxy_set_header Accept-Encoding "identity";

        # Rewrite absolute asset paths ใน HTML ให้ชี้ผ่าน /api/stream/
        # เช่น src="/bundle.js" → src="/api/stream/bundle.js"
        sub_filter 'src="/'  'src="/api/stream/';
        sub_filter 'href="/' 'href="/api/stream/';
        sub_filter_once off;
    }

    # ============================================================
    # /api/* → FastAPI backend (auth, devices, users, etc.)
    # ============================================================
    location /api/ {
        proxy_pass         http://redroid-manager:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Cookie            $http_cookie;
        proxy_read_timeout 300s;
        client_max_body_size 100M;
    }

    # ============================================================
    # / → FastAPI (serve React SPA frontend)
    # ============================================================
    location / {
        proxy_pass         http://redroid-manager:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   Cookie          $http_cookie;
    }
}
