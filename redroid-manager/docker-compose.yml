services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - redroid_net
    restart: unless-stopped
    depends_on:
      - redroid-manager
      - ws-scrcpy

  redroid-manager:
    build: .
    # ไม่ expose port ออก public อีกต่อไป — Nginx รับแทน
    expose:
      - "8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sqlite_data:/app/data
    env_file:
      - .env
    environment:
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - redroid_net
    restart: unless-stopped

  ws-scrcpy:
    image: scavin/ws-scrcpy
    # อยู่ใน internal network เท่านั้น
    networks:
      - redroid_net
    restart: unless-stopped
    depends_on:
      - redroid-manager

networks:
  redroid_net:
    driver: bridge

volumes:
  sqlite_data:

